<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">

  <title>Schedule — Serin Park</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="./schedule.css">
</head>

<body class="planner-page">
  <header>
    <a class="logo" href="./index.html">Serin Park</a>

    <nav>
      <a href="./about.html">About</a>
      <a href="./projects.html">Projects</a>
      <a href="./schedule.html" aria-current="page">Schedule</a>
    </nav>
  </header>

  <main class="planner-shell">
    <section class="planner-intro">
      <div class="planner-intro-copy">
        <p class="eyebrow">MY PLANNER</p>
        <h1>Schedule.</h1>
        <p class="planner-description">
          일정은 이 브라우저에만 저장돼요.
        </p>
      </div>

      <section class="planner-overview" aria-label="일정 달력과 지도">
        <div class="mini-calendar">
          <div class="mini-calendar-header">
            <button id="calendarPrevButton" type="button" aria-label="이전 달">‹</button>
            <strong id="calendarMonthLabel"></strong>
            <button id="calendarNextButton" type="button" aria-label="다음 달">›</button>
          </div>
          <div class="mini-calendar-weekdays" aria-hidden="true">
            <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
          </div>
          <div class="mini-calendar-grid" id="miniCalendarGrid"></div>
          <div class="calendar-filter-summary" id="calendarFilterBar" hidden>
            <span id="calendarFilterSummary"></span>
            <button id="calendarFilterResetButton" type="button">필터 해제</button>
          </div>
          <div class="calendar-preset-buttons" aria-label="빠른 날짜 선택">
            <button id="calendarTodayButton" type="button" aria-pressed="false">오늘</button>
            <button id="calendarThisWeekButton" type="button" aria-pressed="false">이번 주</button>
            <button id="calendarNextWeekButton" type="button" aria-pressed="false">다음 주</button>
          </div>
        </div>

        <div class="planner-map-panel">
          <div class="planner-map-header">
            <div>
              <span id="mapDateKicker">SELECTED DATE</span>
              <strong id="mapDateLabel"></strong>
            </div>
            <div class="planner-map-actions">
              <span id="mapEventCount"></span>
              <label class="home-map-toggle">
                <input id="homeMapToggle" type="checkbox">
                <span class="home-toggle-track" aria-hidden="true"><span></span></span>
                <b>집 표시</b>
              </label>
              <button id="homeLocationButton" type="button">집 설정</button>
            </div>
          </div>
          <div class="home-location-editor" id="homeLocationEditor" hidden>
            <div class="home-location-editor-header">
              <strong>집 위치 설정</strong>
              <button id="homeLocationCloseButton" type="button" aria-label="집 위치 설정 닫기">×</button>
            </div>
            <div class="home-location-search-control">
              <input id="homeLocationInput" type="text" placeholder="동네, 건물명 또는 주소" autocomplete="off">
              <button id="homeLocationSearchButton" type="button">검색</button>
            </div>
            <p class="home-location-status" id="homeLocationStatus" aria-live="polite"></p>
            <div class="home-location-results" id="homeLocationResults" hidden></div>
            <button class="home-location-remove" id="homeLocationRemoveButton" type="button" hidden>저장된 집 위치 삭제</button>
          </div>
          <div class="planner-map" id="plannerMap" aria-label="선택한 날짜의 오프라인 일정 지도"></div>
          <div class="planner-map-empty" id="plannerMapEmpty" hidden></div>
        </div>
      </section>
    </section>

    <section class="planner-layout">
      <aside class="form-card">
        <div class="section-heading">
          <div>
            <p class="section-kicker" id="formKicker">EVENT</p>
            <h2 id="formTitle">일정 보기</h2>
          </div>
          <div class="form-header-actions">
            <button class="text-button" id="newEventButton" type="button">새 일정</button>
            <button class="text-button" id="cancelEditButton" type="button" hidden>취소</button>
          </div>
        </div>
        <div class="form-placeholder" id="formPlaceholder">
          <strong>일정을 선택해보세요.</strong>
          <p>오른쪽에서 일정을 펼치면 정보가 여기에 표시돼요.</p>
        </div>

        <form id="eventForm" hidden>
          <input id="eventId" type="hidden">

          <div class="ios-main-row">
            <label class="ios-standalone-field title-field">
              <input id="title" name="title" type="text" placeholder="일정명" aria-label="일정명 (필수)" required>
            </label>

            <div class="category-picker">
              <input id="category" name="category" type="text" placeholder="카테고리" aria-label="카테고리" autocomplete="off" aria-haspopup="listbox" aria-expanded="false" aria-controls="categoryMenu">
              <button class="category-menu-toggle" id="categoryMenuButton" type="button" aria-label="카테고리 목록 열기" tabindex="-1">
                <span class="category-menu-chevron" aria-hidden="true"></span>
              </button>
              <div class="category-menu" id="categoryMenu" role="listbox" hidden></div>
            </div>
          </div>

          <div class="ios-form-group ios-date-group">
            <label class="compact-date-field">
              <input id="date" name="date" type="date" aria-label="날짜 (필수)" required>
            </label>

            <div class="compact-time-range">
              <label>
                <input id="startTime" name="startTime" type="text" inputmode="numeric" maxlength="5" pattern="(?:[01]?[0-9]|2[0-3]):?[0-5][0-9]" placeholder="09:00" aria-label="시작 시간" autocomplete="off">
              </label>
              <span aria-hidden="true">~</span>
              <label>
                <input id="endTime" name="endTime" type="text" inputmode="numeric" maxlength="5" pattern="(?:[01]?[0-9]|2[0-3]):?[0-5][0-9]" placeholder="18:30" aria-label="종료 시간" autocomplete="off">
              </label>
            </div>
          </div>

          <div class="ios-form-group ios-settings-group">
            <div class="field location-type-field">
              <span>진행 방식</span>
              <div class="segmented-control" role="radiogroup" aria-label="진행 방식">
                <label>
                  <input type="radio" name="locationType" value="offline" checked required>
                  <span>오프라인</span>
                </label>
                <label>
                  <input type="radio" name="locationType" value="online" required>
                  <span>온라인</span>
                </label>
              </div>
            </div>

            <div class="field field-wide location-search-field" id="offlineLocationField">
              <div class="location-field-label">
                <span>장소</span>
                <button class="location-search-button" id="locationSearchButton" type="button">검색</button>
              </div>
              <div class="location-search-control">
                <input id="location" name="location" type="text" placeholder="장소명 또는 주소" autocomplete="off" aria-describedby="locationSearchStatus">
                <input class="location-detail-input" id="locationDetail" name="locationDetail" type="text" placeholder="상세 위치" aria-label="상세 위치" autocomplete="off">
                <div class="location-search-status" id="locationSearchStatus" aria-live="polite"></div>
              </div>
              <div class="location-search-results" id="locationSearchResults" hidden></div>
            </div>

            <label class="field field-wide" id="onlineLinkField" hidden>
              <span>온라인 링크</span>
              <input id="url" name="url" type="url" placeholder="https://zoom.us/...">
            </label>
          </div>

          <div class="reservation-section">
            <span class="reservation-section-label">예약 상태</span>
            <fieldset class="reservation-box" aria-label="예약 상태">
              <div class="segmented-control reservation-state-control">
                <label>
                  <input type="radio" name="reservationStatus" value="none" checked>
                  <span>해당 없음</span>
                </label>
                <label>
                  <input type="radio" name="reservationStatus" value="needed">
                  <span>예약 필요</span>
                </label>
                <label>
                  <input type="radio" name="reservationStatus" value="booked">
                  <span>예약 완료</span>
                </label>
                <label>
                  <input type="radio" name="reservationStatus" value="considering">
                  <span>취소 고려</span>
                </label>
              </div>

            </fieldset>

            <div class="conditional-field cancellation-fields" id="cancellationOptions" hidden>
              <span class="cancellation-deadline-label">무료 취소 기한</span>
              <div class="cancellation-deadline-row">
                <label class="cancellation-compact-field">
                  <input id="cancellationDeadlineDate" name="cancellationDeadlineDate" type="date">
                </label>

                <label class="cancellation-compact-field cancellation-time-field">
                  <input id="cancellationDeadlineTime" name="cancellationDeadlineTime" type="text" inputmode="numeric" maxlength="5" pattern="(?:[01]?[0-9]|2[0-3]):?[0-5][0-9]" placeholder="23:59" autocomplete="off">
                </label>
              </div>

              <label class="cancellation-note-field">
                <input id="cancellationNotes" name="cancellationNotes" type="text" placeholder="취소 관련 메모 (선택)">
              </label>
            </div>
          </div>

          <div class="todo-editor">
            <div class="todo-editor-header">
              <span>To Do</span>
              <button class="text-button" id="addTodoButton" type="button">+ 항목 추가</button>
            </div>
            <div class="todo-input-list" id="todoInputList"></div>
            <p class="todo-empty-note" id="todoEmptyNote">이 일정과 관련된 할 일이 있다면 추가해보세요.</p>
          </div>

          <div class="ios-form-group ios-notes-group">
            <label class="field field-wide">
              <span>메모</span>
              <textarea id="notes" name="notes" rows="2" placeholder="준비물, 링크 등"></textarea>
            </label>
          </div>

          <button class="primary-button" id="saveButton" type="submit">일정 저장</button>
        </form>

        <details class="category-manager">
          <summary>카테고리 관리</summary>
          <p>⠿를 드래그해 순서를 바꿀 수 있어요. 이름 변경은 해당 카테고리의 모든 일정에 함께 적용됩니다.</p>
          <div class="category-manager-list" id="categoryManagerList"></div>
        </details>
      </aside>

      <section class="schedule-panel">
        <div class="view-header">
          <div class="view-tabs" role="tablist" aria-label="일정 보기 방식">
            <button class="view-tab is-active" type="button" data-view="timeline" role="tab" aria-selected="true">시간순</button>
            <button class="view-tab" type="button" data-view="categories" role="tab" aria-selected="false">카테고리</button>
            <button class="view-tab" type="button" data-view="tasks" role="tab" aria-selected="false">할 일</button>
          </div>
        </div>

        <div class="view-panel" id="timelineView" data-panel="timeline"></div>
        <div class="view-panel" id="categoriesView" data-panel="categories" hidden></div>
        <div class="view-panel" id="tasksView" data-panel="tasks" hidden></div>
      </section>
    </section>

    <section class="backup-actions planner-data-actions" aria-label="일정 데이터 관리">
      <button class="quiet-button" id="exportButton" type="button">백업</button>
      <label class="quiet-button file-button">
        불러오기
        <input id="importInput" type="file" accept="application/json">
      </label>
      <button class="quiet-button danger-button" id="clearButton" type="button">전체 삭제</button>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./schedule.js"></script>
</body>
</html>
